version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: apik_postgres
    restart: always
    environment:
      POSTGRES_USER: apik
      POSTGRES_PASSWORD: apik_password
      POSTGRES_DB: apik
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:7-jammy
    container_name: apik_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: apik
      MONGO_INITDB_ROOT_PASSWORD: apik_password
      MONGO_INITDB_DATABASE: apik
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: apik_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: apik_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  n8n_data:
